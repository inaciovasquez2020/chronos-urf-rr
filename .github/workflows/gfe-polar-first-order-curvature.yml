name: GfE polar first-order curvature audit

on:
  push:
    paths:
      - "tools/gfe/gfe_polar_first_order_curvature_operator.py"
      - "tools/gfe/verify_gfe_polar_first_order_curvature_operator.py"
      - "tools/gfe/gfe_polar_second_order_curvature_operator.py"
      - "tools/gfe/verify_gfe_polar_second_order_curvature_operator.py"
      - "tools/gfe/gfe_polar_quadratic_density_coefficient.py"
      - "tools/gfe/verify_gfe_polar_quadratic_density_coefficient.py"
      - "tools/gfe/gfe_polar_angular_reduction.py"
      - "tools/gfe/verify_gfe_polar_angular_reduction.py"
      - "tools/gfe/gfe_polar_action_reference_comparison.py"
      - "tools/gfe/benchmark_gfe_polar_angular_normalization.py"
      - ".github/workflows/gfe-polar-first-order-curvature.yml"
  pull_request:
    paths:
      - "tools/gfe/gfe_polar_first_order_curvature_operator.py"
      - "tools/gfe/verify_gfe_polar_first_order_curvature_operator.py"
      - "tools/gfe/gfe_polar_second_order_curvature_operator.py"
      - "tools/gfe/verify_gfe_polar_second_order_curvature_operator.py"
      - "tools/gfe/gfe_polar_quadratic_density_coefficient.py"
      - "tools/gfe/verify_gfe_polar_quadratic_density_coefficient.py"
      - "tools/gfe/gfe_polar_angular_reduction.py"
      - "tools/gfe/verify_gfe_polar_angular_reduction.py"
      - "tools/gfe/benchmark_gfe_polar_angular_normalization.py"
      - ".github/workflows/gfe-polar-first-order-curvature.yml"

permissions:
  contents: read

jobs:
  exact-first-order-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install symbolic dependency
        run: python -m pip install --disable-pip-version-check sympy
      - name: Test exact angular substitution on l=2 harmonic and derivatives
        run: python tools/gfe/verify_gfe_polar_angular_reduction.py
      - name: Run independent first-order curvature audit
        run: python tools/gfe/verify_gfe_polar_first_order_curvature_operator.py
      - name: Run independent second-order curvature operator audit
        run: python tools/gfe/verify_gfe_polar_second_order_curvature_operator.py
      - name: Run raw quadratic density coefficient verification
        run: python tools/gfe/verify_gfe_polar_quadratic_density_coefficient.py --trust-prior-second-order-replay
      - name: Preserve raw density, integrated expression, and receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gfe-polar-angular-reduction-evidence-${{ github.sha }}
          path: |
            gfe_polar_raw_epsilon_squared_density.srepr.txt
            gfe_polar_integrated_epsilon_squared_density.srepr.txt
            gfe_polar_angular_reduction_receipt.json
            gfe_polar_action_comparison_receipt.json
          if-no-files-found: warn
          retention-days: 7

  angular-normalization-benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install symbolic dependency
        run: python -m pip install --disable-pip-version-check sympy
      - name: Benchmark exact normalization operations on digest-locked input
        run: python tools/gfe/benchmark_gfe_polar_angular_normalization.py
      - name: Preserve isolated benchmark receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gfe-polar-normalization-benchmark-${{ github.sha }}
          path: gfe_polar_normalization_benchmark.json
          if-no-files-found: warn
          retention-days: 14
