name: URF-AI Toolkit CI

on:
  push:
    branches:
      - main
      - experiment/urf-ai-benchmark-v1
    paths:
      - "tools/research-agent-toolkit/**"
      - ".github/workflows/urf-ai-toolkit-ci.yml"
  pull_request:
    paths:
      - "tools/research-agent-toolkit/**"
      - ".github/workflows/urf-ai-toolkit-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  toolkit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONPATH: tools/research-agent-toolkit/src
    steps:
      - name: Checkout exact branch revision
        uses: actions/checkout@v4
      - name: Configure Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test runner
        run: python -m pip install --disable-pip-version-check pytest==8.4.2
      - name: Run complete research-agent-toolkit test suite
        run: python -B -m pytest -q tools/research-agent-toolkit/tests
      - name: Run mathematical benchmark selftest and adversarial regression
        run: python -B tools/research-agent-toolkit/src/research_agent_toolkit/urf_ai_benchmark.py --selftest
