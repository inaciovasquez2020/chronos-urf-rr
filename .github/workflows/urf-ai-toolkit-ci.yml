name: URF-AI deterministic benchmark (read-only)

on:
  push:
    branches:
      - main
    paths:
      - "tools/research-agent-toolkit/**"
      - ".github/workflows/urf-ai-toolkit-ci.yml"
  pull_request:
    paths:
      - "tools/research-agent-toolkit/**"
      - ".github/workflows/urf-ai-toolkit-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  toolkit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONPATH: tools/research-agent-toolkit/src
    steps:
      - name: Checkout exact revision without persistent credentials
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Configure Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pinned test runner
        run: python -m pip install --disable-pip-version-check pytest==8.4.2
      - name: Run full research-agent-toolkit regression suite
        run: python -B -m pytest -q tools/research-agent-toolkit/tests
      - name: Verify finite 22-case benchmark
        run: python -B -m research_agent_toolkit.urf_ai_benchmark --selftest
      - name: Verify exact-rational curvature subcases
        run: python -B -m research_agent_toolkit.urf_ai_curvature_benchmark
