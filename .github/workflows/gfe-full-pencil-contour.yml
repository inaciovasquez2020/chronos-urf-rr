name: GfE full-pencil contour certificate

on:
  pull_request:
    paths:
      - "tools/gfe/verify_gfe_full_six_state_exterior_contour.py"
      - "artifacts/chronos/gfe_corrected_AEH_half_euler_generator.json"
      - ".github/workflows/gfe-full-pencil-contour.yml"

jobs:
  exact-contour:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install exact algebra dependencies
        run: python -m pip install --disable-pip-version-check sympy
      - name: Exclude exterior rank-loss point from full-pencil contour
        run: python tools/gfe/verify_gfe_full_six_state_exterior_contour.py
