name: GfE symbolic-M Riesz check
on:
  push:
    branches:
      - main
      - proof/gfe-symbolic-M-riesz-check-20261016
  pull_request:
    branches:
      - main
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  exact-symbolic-check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install sympy
      - name: Run exact symbolic-M resolvent calculation
        run: python tools/gfe/derive_gfe_symbolic_M_riesz_check.py
      - name: Run fixed-point limiting-resolvent bridge
        run: python tools/gfe/check_gfe_symbolic_M_fixed_point_bridge.py
      - name: Upload exact result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gfe-symbolic-M-riesz-check
          path: artifacts/chronos/gfe_symbolic_M_riesz_check.json
          if-no-files-found: ignore
