name: URF-AI macOS controller audit

on:
  push:
    branches:
      - audit/urf-ai-controller-real-gate-20261113
    paths:
      - "tools/research-agent-toolkit/urf-ai/**"
      - ".github/workflows/urf-ai-macos-controller-audit.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/heads/audit/urf-ai-controller-real-gate-20261113') }}

permissions:
  contents: read

jobs:
  macos-kernel-peer-boundary:
    runs-on: macos-15
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: macOS environment
        run: |
          sw_vers
          python3 --version
          python3 -c 'import sys; assert sys.version_info >= (3, 11), "Python 3.11+ required"'
          id -u
          python3 -c 'import os,pwd; assert any(u.pw_uid not in (0,os.getuid()) for u in pwd.getpwall()), "no distinct worker UID"'
      - name: Real kernel peer identity and key isolation (no downloads)
        working-directory: tools/research-agent-toolkit/urf-ai
        env:
          PYTHONPATH: .
        run: python3 -B tests/macos_controller_isolation.py
      - name: Authenticated fsync crash/restart on macOS (no downloads)
        working-directory: tools/research-agent-toolkit/urf-ai
        env:
          PYTHONPATH: .
        run: python3 -B tests/macos_durable_recovery.py
      - name: Killed controller, exclusive journal recovery and stale-socket rebind
        working-directory: tools/research-agent-toolkit/urf-ai
        env:
          PYTHONPATH: .
        run: python3 -B tests/macos_owned_controller_restart.py
      - name: Distinct UID checkpoint writer, credential denial and CAS replay
        working-directory: tools/research-agent-toolkit/urf-ai
        env:
          PYTHONPATH: .
        run: python3 -B tests/macos_checkpoint_unix_cross_uid.py
