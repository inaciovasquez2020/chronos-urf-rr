name: CI

on:
  push:
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Install Lean (stable)
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y
          export PATH="$HOME/.elan/bin:$PATH"
          elan default leanprover/lean4:stable
          lake --version

      - name: Fetch mathlib cache
        run: |
          export PATH="$HOME/.elan/bin:$PATH"
          lake exe cache get || true

      - name: Build Lean project
        run: |
          export PATH="$HOME/.elan/bin:$PATH"
          lake build

      - name: Audit gravity theorem axioms
        run: |
          export PATH="$HOME/.elan/bin:$PATH"
          lake lean lean/GravityAxiomAudit.lean

      - name: Verify operator norm perturbation boundary
        run: python3 tools/verifier/verify_operator_norm_perturbation_boundary.py

      - name: Verify Chronos descriptor rank-loss certificate
        run: |
          python3 -m pip install --disable-pip-version-check sympy pytest
          python3 -m pytest -q tests/test_gfe_corrected_descriptor_rankloss.py

      - name: Verify exact finite-beta horizon indicial system
        run: python3 tools/gfe/verify_gfe_corrected_finite_beta_horizon_indicial.py

      - name: Audit minimal log3 finite-beta horizon chain
        run: python3 tools/gfe/verify_gfe_corrected_finite_beta_horizon_log3.py

      - name: Audit minimal log4 finite-beta horizon chain
        run: python3 tools/gfe/verify_gfe_corrected_finite_beta_horizon_log4.py

      - name: Certify all finite-log finite-beta horizon obstruction
        run: python3 tools/gfe/verify_gfe_corrected_finite_beta_horizon_all_finite_logs.py

      - name: Verify corrected exceptional horizon recurrence
        run: python3 tools/gfe/verify_gfe_corrected_finite_beta_horizon_exceptional.py

      - name: Certify exceptional all-order formal recurrence
        run: python3 tools/gfe/verify_gfe_corrected_finite_beta_horizon_exceptional_all_order.py

      - name: Audit exceptional discrete resonance lift
        run: python3 tools/gfe/verify_gfe_corrected_finite_beta_horizon_exceptional_resonance_lift.py

      - name: Certify full exceptional formal horizon coverage
        run: python3 tools/gfe/verify_gfe_corrected_finite_beta_horizon_exceptional_full_formal.py

      - name: Audit exceptional accumulation-point coefficient growth
        run: python3 tools/gfe/run_gfe_corrected_exceptional_accumulation_newton.py

      - name: Propagate physical accumulation top-log seed
        run: python3 tools/gfe/verify_gfe_corrected_exceptional_accumulation_physical_seed.py

      - name: Expose accumulation cone transfer coefficients
        run: python3 tools/gfe/verify_gfe_corrected_exceptional_accumulation_cone_coefficients.py

      - name: Certify accumulation invariant growth cone
        run: python3 tools/gfe/verify_gfe_corrected_exceptional_accumulation_invariant_cone.py

      - name: Certify one-sided Borel boundary asymptotic
        run: python3 tools/gfe/verify_gfe_corrected_exceptional_accumulation_boundary_asymptotic.py

      - name: Certify cleared order-2 Borel operator
        run: python3 tools/gfe/verify_gfe_corrected_exceptional_accumulation_borel_operator.py

      - name: Audit Ore row reduction of Borel operator
        run: python3 tools/gfe/verify_gfe_corrected_exceptional_accumulation_borel_row_reduction.py

      - name: Certify reduced Borel denominator support
        run: python3 tools/gfe/verify_gfe_corrected_exceptional_accumulation_borel_reduced_denominators.py

      - name: Run remaining Python verifiers
        run: |
          python3 tools/verifier/verify_chronos_semantic_derivation_rules_boundary.py
          python3 tools/verifier/verify_gravity_boundary.py
          python3 tools/verifier/verify_secular_vanishing_polynomial_input_surface.py
          python3 scripts/verify_external_status_lock.py
