name: cosmology-causal-projection

on:
  pull_request:
    paths:
      - "research/certificates/cosmology_causal_projection/**"
      - ".github/workflows/cosmology-causal-projection.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  causal-projection:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Verify original receipt
        working-directory: research/certificates/cosmology_causal_projection
        run: |
          (cd receipt && sha256sum -c SHA256SUMS)
          python3 audit.py receipt/LEAN.log

      - name: Reproduce Lean build
        uses: leanprover/lean-action@v1
        with:
          lake-package-directory: research/certificates/cosmology_causal_projection
          build: true
          test: false
          lint: false
          use-mathlib-cache: true

      - name: Fresh axiom audit
        working-directory: research/certificates/cosmology_causal_projection
        run: |
          set -euo pipefail
          lake env lean receipt/CausalProjection.lean > fresh.log 2>&1 || {
            cat fresh.log
            exit 1
          }
          cat fresh.log
          python3 audit.py fresh.log
          git diff --exit-code -- lake-manifest.json
