[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "research-agent-toolkit"
version = "0.2.0"
description = "Deterministic governance, dependency scanning, tracing, receipts, and local research indexing for AI-assisted repositories."
requires-python = ">=3.11"
dependencies = []

[project.scripts]
rat = "research_agent_toolkit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
